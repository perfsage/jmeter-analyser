[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:redis]
command=bash -c "mkdir -p /app/data/redis && exec redis-server --bind 127.0.0.1 --port 6379 --dir /app/data/redis --appendonly yes"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=python -m arq perfsage.core.jobs.queue.WorkerSettings
directory=/app
user=perfsage
environment=HOME="/home/perfsage",REDIS_URL="redis://127.0.0.1:6379",BROWSER_PATH="/usr/bin/chromium",CHROME_PATH="/usr/bin/chromium"
autostart=true
autorestart=true
priority=20
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
command=uvicorn perfsage.main:app --host 0.0.0.0 --port 8000
directory=/app
user=perfsage
environment=HOME="/home/perfsage",REDIS_URL="redis://127.0.0.1:6379",BROWSER_PATH="/usr/bin/chromium",CHROME_PATH="/usr/bin/chromium"
autostart=true
autorestart=true
priority=30
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
