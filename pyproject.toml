[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "perfsage"
version = "0.1.0"
description = "PerfSage JMeter Analyser — a Python-only, Dockerised, browser-based JMeter result analyser"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1.0",
    # Data
    "duckdb>=0.10.3",
    "pyarrow>=16.0.0",
    "polars>=0.20.23",
    "lxml>=5.2.2",
    # Viz
    "plotly>=5.22.0",
    "kaleido>=0.2.1",
    # Storage
    "sqlmodel>=0.0.19",
    "pydantic-settings>=2.3.0",
    "cryptography>=42.0.8",
    # Jobs
    "arq>=0.26.1",
    "redis>=5.0.6",
    "aiofiles>=23.2.1",
    # AI
    "openai>=1.35.0",
    "anthropic>=0.29.0",
    "google-genai>=1.0.0",
    # Export
    "weasyprint>=62.3",
    "numpy>=2.4.6",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "hypothesis>=6.104.2",
    "playwright>=1.44.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["perfsage"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"perfsage/web/templates/**" = ["E501"]
"perfsage/api/**" = ["B008"]
"perfsage/web/**" = ["B008"]

[tool.mypy]
strict = true
ignore_missing_imports = true
python_version = "3.12"
exclude = ["tests/e2e"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
