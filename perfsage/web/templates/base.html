<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PerfSage — JMeter Analyser</title>
    <script src="https://unpkg.com/htmx.org@2.0.0/dist/htmx.min.js"></script>
    <style>
        :root {
            --navy:  #0B1F3A;
            --cream: #F6F1E7;
            --amber: #D4A857;
        }
        body { background: var(--navy); color: var(--cream); font-family: system-ui, sans-serif; margin: 0; }
        header { background: var(--navy); border-bottom: 2px solid var(--amber); padding: 1rem 2rem; }
        header h1 { margin: 0; color: var(--amber); }
        main { padding: 2rem; }
    </style>
</head>
<body>
    <header>
        <h1>PerfSage</h1>
    </header>
    <main>
        <p>Welcome to PerfSage JMeter Analyser. Upload a JMeter result file to get started.</p>
    </main>
</body>
</html>
