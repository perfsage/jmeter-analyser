<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}PerfSage — JMeter Analyser{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/perfsage.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="navbar">
    <a href="/" class="brand">
      <img src="/static/img/perfsage-logo.png" class="logo" alt="PerfSage">
      <span>PerfSage Analyser</span>
    </a>
    <a href="/">Dashboard</a>
    <a href="/reports">Reports</a>
    <a href="/settings">Settings</a>
  </nav>
  <main style="max-width:1280px;margin:0 auto;padding:2rem 1.5rem">
    {% block content %}{% endblock %}
  </main>
  <footer>
    <p>Powered by <a href="https://perfsage.com" target="_blank">PerfSage</a> — AI-powered performance engineering</p>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
