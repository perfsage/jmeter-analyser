<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}PerfSage — JMeter Analyser{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/perfsage.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="/static/js/plotly.min.js"></script>
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="navbar">
    <a href="/" class="brand">
      <img src="/static/img/perfsage-logo.png" class="logo" alt="PerfSage">
      <span>PerfSage Analyser</span>
    </a>
    <a href="/">Dashboard</a>
    <a href="/reports">Reports</a>
    <a href="/settings">Settings</a>
  </nav>
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>Powered by <a href="https://perfsage.com" target="_blank" rel="noopener">PerfSage</a>
      &middot; <a href="https://topmate.io/abajpai/" target="_blank" rel="noopener">Need perf testing help?</a></p>
  </footer>
  <div id="toast-root"></div>
  <script src="/static/js/nudge.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
