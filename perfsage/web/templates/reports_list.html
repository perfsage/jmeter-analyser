{% extends "base.html" %}
{% block title %}All Reports — PerfSage{% endblock %}
{% block content %}
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem">
  <h1>All Reports</h1>
  <div style="display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap">
    <form hx-post="/api/reports/flush?keep_recent=5"
          hx-target="#reports-table"
          hx-swap="innerHTML"
          hx-confirm="Remove all reports except the 5 most recent? This cannot be undone."
          hx-disabled-elt="this">
      <button type="submit" class="btn-outline" style="color:#c53030;border-color:#c53030">
        Flush old reports
      </button>
    </form>
    <a href="/" class="btn-primary">+ New Analysis</a>
  </div>
</div>
<div class="card" id="reports-table">
  {% include "partials/reports_table.html" %}
</div>
{% endblock %}
